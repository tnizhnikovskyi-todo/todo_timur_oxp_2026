# Статика зі dist/ плюс маленький API у worker.js — спільний запис «хто на
# які доповіді йде» для вкладки «Подія».
#
# Cloudflare веде нові проєкти через Workers, а не Pages, тому деплой іде
# командою `npx wrangler deploy`. Запити на файли обслуговують активи; те, що
# на файл не схоже (/api/picks), потрапляє у worker.js.
#
# Ім'я має збігатися з назвою проєкту в панелі Cloudflare.

name = "todo-timur-oxp-2026"
main = "worker.js"
compatibility_date = "2026-08-25"

# Основна адреса потрібна — це і є сторінка.
workers_dev = true

# Змінні ODOO_URL, ODOO_DB, ODOO_LOGIN і секрет ODOO_API_KEY задаються в панелі
# Cloudflare (Settings → Variables and Secrets), а не тут: без цього рядка деплой
# із репозиторію стирав би їх при кожному пуші.
keep_vars = true

# Обмін з Odoo раз на п’ять хвилин — і тоді, коли на сайті ніхто нічого не тисне.
# Після кожної позначки воркер і сам штовхає її в Odoo за кілька секунд.
[triggers]
crons = ["*/5 * * * *"]

# А ось окремі адреси на кожну версію деплою — ні. Вся непублічність тут
# тримається на тому, що посилання не вгадується; preview-адреси плодили б
# по одному живому URL на кожен пуш, і старі версії лишалися б доступними.
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"

# Сховище спільного запису — один Durable Object на SQLite. Ресурс не треба
# створювати в панелі: міграція нижче робить це при першому деплої.
[[durable_objects.bindings]]
name = "PICKS"
class_name = "Picks"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Picks"]

# not_found_handling = "404-page" — сторінка одна, спеціальної обробки не треба.
